{% extends "base.html" %} {% block title %}Dashboard{% endblock %} 
{% block content%}
<link rel="stylesheet" href="../static/css/dashboard.css" />
<div class="row">
    <div class="col-lg col-md-3 col-sm-6 mb-4">
        <div class="stats-small stats-small--1 card card-small">
        <div class="card-body p-0 d-flex">
            <div class="d-flex flex-column m-auto">
            <div class="stats-small__data text-center">
                <span class="stats-small__label text-uppercase">Total Requests</span>
                <h6 class="stats-small__value total_requests my-3">0</h6>
            </div>
            <div class="stats-small__data">
                <span class="stats-small__percentage stats-small__percentage--increase">4.7%</span>
            </div>
            </div>
            <canvas height="120" class="blog-overview-stats-small-1"></canvas>
        </div>
        </div>
    </div>
    <div class="col-lg col-md-3 col-sm-6 mb-4">
        <div class="stats-small stats-small--1 card card-small">
        <div class="card-body p-0 d-flex">
            <div class="d-flex flex-column m-auto">
            <div class="stats-small__data text-center">
                <span class="stats-small__label text-uppercase">Orders</span>
                <h6 class="stats-small__value count my-3">8</h6>
            </div>
            <div class="stats-small__data">
                <span class="stats-small__percentage stats-small__percentage--increase">12.4%</span>
            </div>
            </div>
            <canvas height="120" class="blog-overview-stats-small-2"></canvas>
        </div>
        </div>
    </div>
    <div class="col-lg col-md-3 col-sm-6 mb-4">
        <div class="stats-small stats-small--1 card card-small">
        <div class="card-body p-0 d-flex">
            <div class="d-flex flex-column m-auto">
            <div class="stats-small__data text-center">
                <span class="stats-small__label text-uppercase">Users</span>
                <h6 class="stats-small__value count my-3">10</h6>
            </div>
            <div class="stats-small__data">
                <span class="stats-small__percentage stats-small__percentage--increase">12.4%</span>
            </div>
            </div>
            <canvas height="120" class="blog-overview-stats-small-4"></canvas>
        </div>
        </div>
    </div>
    <div class="col-lg col-md-3 col-sm-6 mb-4">
        <div class="stats-small stats-small--1 card card-small">
        <div class="card-body p-0 d-flex">
            <div class="d-flex flex-column m-auto">
            <div class="stats-small__data text-center">
                <span class="stats-small__label text-uppercase">Subscribers</span>
                <h6 class="stats-small__value count my-3">8</h6>
            </div>
            <div class="stats-small__data">
                <span class="stats-small__percentage stats-small__percentage--decrease">2.4%</span>
            </div>
            </div>
            <canvas height="120" class="blog-overview-stats-small-5"></canvas>
        </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Requests per day</div>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="requestsPerDay"></canvas>
                </div>
            </div>
        </div>
        <!-- <div class="card">
            <div><canvas id="requestsPerDay"></canvas></div>
        </div> -->
    </div>
    <div class="col-12 mt-2">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Requests per hour</div>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="requestsPerHour"></canvas>
                </div>
            </div>
        </div>
        <!-- <div class="card">
            <div><canvas id="requestsPerDay"></canvas></div>
        </div> -->
    </div>
    <!-- <div class="card">
        <div><canvas id="requestsPerHour"></canvas></div>
    </div> -->
</div>
{% endblock %}

{% block javascripts %}
    <script src="../static/index.js"></script>
{% endblock javascripts%}
